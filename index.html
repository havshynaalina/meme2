<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">

    <div class="wall"></div>

    <div class="panel panel-1"></div>
    <div class="panel panel-2"></div>
    <div class="panel panel-3"></div>
    <div class="panel panel-4"></div>

    <div class="flag">
        <div class="flag-blue"></div>
        <div class="flag-yellow"></div>
    </div>

    <div class="chair">
        <div class="chair-back"></div>
        <div class="chair-light"></div>
    </div>


    <div class="body">

        <div class="dress"></div>

        <div class="shoulder-left"></div>
        <div class="shoulder-right"></div>

        <div class="dress-line left"></div>
        <div class="dress-line right"></div>

        <div class="collar-left"></div>
        <div class="collar-right"></div>

        <div class="brooch">
            <div class="brooch-inner"></div>
        </div>
    </div>


    <div class="neck"></div>


    <div class="ear ear-left"></div>
    <div class="ear ear-right"></div>

    <div class="head"></div>

    <div class="hair"></div>
    <div class="hair-back"></div>

        <div class="braid braid-1"></div>
        <div class="braid braid-2"></div>
        <div class="braid braid-3"></div>
        <div class="braid braid-4"></div>
        <div class="braid braid-5"></div>
        <div class="braid braid-6"></div>
        <div class="braid braid-7"></div>
        <div class="braid braid-8"></div>

    <div class="eyebrow eyebrow-left"></div>
    <div class="eyebrow eyebrow-right"></div>

    <div class="eye eye-left"></div>
    <div class="eye eye-right"></div>

    <div class="pupil pupil-left"></div>
    <div class="pupil pupil-right"></div>

    <div class="nose"></div>

    <div class="mouth"></div>
    <div class="lips-line"></div>


    <div class="arm-left"></div>
    <div class="arm-right"></div>

    <div class="hand hand-left"></div>
    <div class="hand hand-right"></div>

        <div class="finger finger-1"></div>
        <div class="finger finger-2"></div>
        <div class="finger finger-3"></div>
        <div class="finger finger-4"></div>

    <div class="hand-shadow"></div>


    <div class="table"></div>

    <div class="paper"></div>
</div>

</body>
</html>
